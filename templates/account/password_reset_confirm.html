{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Set New Password - Spotify Clone{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-dark border-light">
                <div class="card-header">
                    <h3 class="card-title mb-0">Set New Password</h3>
                </div>
                <div class="card-body">
                    <p class="text-muted mb-4">Please enter your new password twice to verify.</p>
                    <form method="post" novalidate>
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-success w-100">Change Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
