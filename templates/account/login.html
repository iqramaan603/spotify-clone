{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login - Spotify Clone{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-dark border-light">
                <div class="card-header">
                    <h4 class="card-title mb-0">Login</h4>
                </div>
                <div class="card-body">
                    <form method="post" novalidate>
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" name="email" id="email" class="form-control bg-dark text-light" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" name="password" id="password" class="form-control bg-dark text-light" required>
                        </div>
                        <button type="submit" class="btn btn-success">Login</button>
                    </form>
                </div>
                <div class="card-footer text-center">
                    <p class="mb-0">Don't have an account? <a href="{% url 'accounts:register' %}" class="text-success">Register</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
