{% load static %}

<div id="music-player" class="fixed-bottom bg-dark border-top border-light">
    <div class="container-fluid">
        <div class="row align-items-center py-2">
            <!-- Song Info -->
            <div class="col-md-3">
                <div class="d-flex align-items-center">
                    <img id="current-song-image" src="{% static 'images/default-album.png' %}" alt="Album Cover" 
                         class="me-3" style="width: 50px; height: 50px; object-fit: cover;">
                    <div>
                        <h6 id="current-song-title" class="mb-0">No song playing</h6>
                        <small id="current-song-artist" class="text-muted">-</small>
                    </div>
                </div>
            </div>

            <!-- Player Controls -->
            <div class="col-md-6">
                <div class="d-flex flex-column align-items-center">
                    <!-- Control Buttons -->
                    <div class="mb-2">
                        <button class="btn btn-link text-light" id="prev-button">
                            <i class="fas fa-step-backward"></i>
                        </button>
                        <button id="play-pause" class="btn btn-success rounded-circle mx-3">
                            <i class="fas fa-play"></i>
                        </button>
                        <button class="btn btn-link text-light" id="next-button">
                            <i class="fas fa-step-forward"></i>
                        </button>
                    </div>

                    <!-- Progress Bar -->
                    <div class="w-100 d-flex align-items-center">
                        <span id="current-time" class="text-muted small me-2">0:00</span>
                        <div id="progress-container" class="progress flex-grow-1" style="height: 4px; cursor: pointer;">
                            <div id="song-progress" class="progress-bar bg-success" role="progressbar" style="width: 0%"></div>
                        </div>
                        <span id="duration" class="text-muted small ms-2">0:00</span>
                    </div>
                </div>
            </div>

            <!-- Volume Control -->
            <div class="col-md-3">
                <div class="d-flex align-items-center justify-content-end">
                    <i class="fas fa-volume-up text-light me-2"></i>
                    <input type="range" class="form-range" min="0" max="1" step="0.1" value="1"
                           style="width: 100px;" id="volume-control">
                </div>
            </div>
        </div>
    </div>
</div>
