{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Create Playlist - Spotify Clone{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card bg-dark border-light">
                <div class="card-header">
                    <h4 class="mb-0">Create New Playlist</h4>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="mt-4">
                            <button type="submit" class="btn btn-success">Create Playlist</button>
                            <a href="{% url 'playlists:playlist_list' %}" class="btn btn-outline-light">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
